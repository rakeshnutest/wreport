image: python:2.7.11-onbuild

stages:
  - build
  - test
  - deploy

sdist:
  stage: build
  tags:
    - docker
  script: make sdist
  artifacts:
    paths:
      - dist/

bdist:
  stage: build
  tags:
    - docker
  script: make bdist
  artifacts:
    paths:
      - dist/

apidoc:
  stage: build
  tags:
    - docker
  script: make apidoc
  artifacts:
    paths:
      - apidoc/_build/html

alldoc:
  stage: build
  tags:
    - docker
  script: make alldoc
  artifacts:
    paths:
      - alldoc/_build/html

test:
  stage: test
  tags:
    - docker
  script: make test
  artifacts:
    paths:
      - htmlcov/

pylint:
  stage: test
  tags:
    - docker
  script: make pylint
  allow_failure: true
