stages:
  - test

.requirements: &requirements
  before_script:
    - pip install -r requirements.txt

.unit_test_template: &unit_test
  stage: test
  tags:
    - docker
  <<: *requirements
  script:
    - python -m coverage run --branch --source=wreport ./setup.py test
    - python -m coverage report -m

python2:
  image: python:2
  <<: *unit_test

pylint:
  image: python:2
  stage: test
  tags:
    - docker
  <<: *requirements
  script:
    - pylint --rcfile=.pylintrc wreport
